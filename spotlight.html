  box-sizing: border-box;
  margin: 0;
  padding: 0;

  --accent: #7c8fff;
  --accent-glow: rgba(124, 143, 255, 0.38);
  --accent2: #c4aaff;
  --cyan: #38bdf8;
  --text-main: rgba(255, 255, 255, 0.96);
  --text-muted: rgba(255, 255, 255, 0.48);
  --glass-bg: rgba(22, 26, 44, 0.88);
  --glass-border: rgba(255, 255, 255, 0.18);
  --glass-shine: rgba(255, 255, 255, 0.3);
  --spring: cubic-bezier(0.16, 1, 0.3, 1);
  --spring-rubberband: cubic-bezier(0.28, 1.35, 0.42, 1);
  --spring-bounce: cubic-bezier(0.34, 1.48, 0.64, 1);
  --spring-overshoot: cubic-bezier(0.25, 1.18, 0.42, 1);
  --smooth: cubic-bezier(0.22, 1, 0.36, 1);

html, body {

/* ═════════════════════════════════════════════════════════════
   ROOT GLASS SHELL
   - Strictly NO outer box-shadow that gets clipped by window!
   - Only crisp inset highlights & border.
═════════════════════════════════════════════════════════════ */
#shell {
  position: absolute;
  top: 6px;
  left: 50%;
  transform: translateX(-50%);
  height: 58px;
  width: 58px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 29px;
  background: var(--glass-bg);
  backdrop-filter: blur(50px) saturate(200%);
  -webkit-backdrop-filter: blur(50px) saturate(200%);
  border: 1px solid var(--glass-border);
  box-shadow:
    inset 0 1px 1.5px var(--glass-shine),
    inset 0 -1px 1px rgba(0, 0, 0, 0.28),
    0 8px 24px rgba(0, 0, 0, 0.28);
  opacity: 0;
  pointer-events: none;
  will-change: width, transform, opacity, border-radius;
}

/* ── SEARCH MODE STATES: CIRCLE ↔ CAPSULE MORPH ── */

/* 1. Initial / Hidden: small circle invisible at center */
#shell.search-mode.state-hidden {
  opacity: 0 !important;
  width: 58px !important;
  height: 58px !important;
  border-radius: 29px !important;
  transform: translateX(-50%) scale(0.65) !important;
  pointer-events: none !important;
  transition: none !important;
}

/* 2. Circle Pop: frosted liquid glass circle pops in at center with spring bounce */
#shell.search-mode.state-circle {
  opacity: 1 !important;
  width: 58px !important;
  height: 58px !important;
  border-radius: 29px !important;
  transform: translateX(-50%) scale(1) !important;
  pointer-events: auto !important;
  box-shadow:
    inset 0 1px 2px rgba(255, 255, 255, 0.5),
    inset 0 -1px 1px rgba(0, 0, 0, 0.28),
    0 10px 28px rgba(0, 0, 0, 0.35) !important;
  transition:
    opacity 0.18s ease,
    transform 0.24s cubic-bezier(0.34, 1.48, 0.64, 1) !important;
}

/* 3. Expanded Capsule: smoothly unrolls into full 740px pill with elastic rubberband stretch & snap */
#shell.search-mode.state-expanded {
  opacity: 1 !important;
  width: 740px !important;
  transform: translateX(-50%) scale(1) !important;
  pointer-events: auto !important;
  box-shadow:
    inset 0 1px 1.5px var(--glass-shine),
    inset 0 -1px 1px rgba(0, 0, 0, 0.28),
    0 12px 32px rgba(0, 0, 0, 0.32) !important;
  transition:
    width 0.44s cubic-bezier(0.28, 1.35, 0.42, 1),
    transform 0.38s cubic-bezier(0.28, 1.35, 0.42, 1) !important;
}
#shell.search-mode.state-expanded:not(.has-results):not(.has-settings) {
  height: 58px !important;
  border-radius: 29px !important;
}

/* 4. Collapsing: pill contracts horizontally back to 58px circle */
#shell.search-mode.state-collapsing {
  opacity: 1 !important;
  width: 58px !important;
  height: 58px !important;
  border-radius: 29px !important;
  transform: translateX(-50%) scale(1) !important;
  pointer-events: none !important;
  box-shadow:
    inset 0 1px 2px rgba(255, 255, 255, 0.45),
    inset 0 -1px 1px rgba(0, 0, 0, 0.28) !important;
  transition:
    width 0.32s cubic-bezier(0.32, 0, 0.67, 0),
    height 0.22s ease,
    border-radius 0.22s ease !important;
}

/* 5. Collapsing Exit: circle shrinks down & dissolves */
#shell.search-mode.state-collapsing-exit {
  opacity: 0 !important;
  width: 58px !important;
  height: 58px !important;
  border-radius: 29px !important;
  transform: translateX(-50%) scale(0.2) !important;
  pointer-events: none !important;
  transition:
    transform 0.22s cubic-bezier(0.4, 0, 1, 1),
    opacity 0.20s ease !important;
}

/* Specular light shimmer across glass surface */
#shell::after {
  content: '';
  position: absolute;
  top: -80%;
  left: -80%;
  width: 260%;
  height: 260%;
  background: linear-gradient(
    115deg,
    transparent 38%,
    rgba(255, 255, 255, 0.03) 44%,
    rgba(255, 255, 255, 0.24) 50%,
    rgba(255, 255, 255, 0.03) 56%,
    transparent 62%
  );
  transform: translateX(-100%) rotate(25deg);
  pointer-events: none;
  z-index: 999;
}
#shell.shimmer::after {
  animation: glassShimmer 0.75s var(--spring) forwards;
}
@keyframes glassShimmer {
  0%   { transform: translateX(-100%) translateY(-100%) rotate(25deg); opacity: 0; }
  25%  { opacity: 1; }
  100% { transform: translateX(100%) translateY(100%) rotate(25deg); opacity: 0; }
}

/* When in dropdown results mode (maintains exact center at left:50% and 740px width!) */
#shell.search-mode.has-results,
#shell.search-mode.has-settings,
#shell.search-mode.state-expanded.has-results,
#shell.search-mode.state-expanded.has-settings {
  position: absolute !important;
  top: 6px !important;
  left: 50% !important;
  transform: translateX(-50%) !important;
  width: 740px !important;
  height: calc(100% - 12px) !important;
  border-radius: 20px !important;
  opacity: 1 !important;
  pointer-events: auto !important;
  box-shadow:
    inset 0 1px 1.5px var(--glass-shine),
    inset 0 -1px 1px rgba(0, 0, 0, 0.28),
    0 16px 48px rgba(0, 0, 0, 0.45) !important;
  transition: height 0.28s cubic-bezier(0.25, 1.15, 0.45, 1), border-radius 0.2s ease !important;
}
#shell.search-mode.has-results .search-input-wrap {
  opacity: 1 !important;
  transform: translateX(0) !important;
  pointer-events: auto !important;
}
#shell.search-mode.has-settings #search-bar {
  display: none !important;
}
#shell.search-mode.has-settings #results-panel {
  display: none !important;
}

/* When in full browser mode: 100% edge-to-edge, perfectly centered with left:50% and translateX(-50%) */
#shell.browser-mode {
  position: absolute !important;
  top: 0 !important;
  left: 50% !important;
  transform: translateX(-50%) !important;
  width: 100% !important;
  height: 100% !important;
  border-radius: 18px !important;
  opacity: 1 !important;
  pointer-events: auto !important;
  background: var(--glass-bg);
  backdrop-filter: blur(52px) saturate(220%);
  -webkit-backdrop-filter: blur(52px) saturate(220%);
  border: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 1.5px var(--glass-shine) !important;
  transform-origin: 50% 16%;
  transition:
    transform 0.38s cubic-bezier(0.25, 1.18, 0.42, 1),
    width 0.28s cubic-bezier(0.16, 1, 0.3, 1),
    height 0.28s cubic-bezier(0.16, 1, 0.3, 1),
    opacity 0.24s ease,
    border-radius 0.28s ease !important;
}

#shell.browser-mode.browser-enter {
  opacity: 0 !important;
  left: 50% !important;
  transform: translateX(-50%) scaleX(0.59) scaleY(0.065) translateY(-30px) !important;
  border-radius: 29px !important;
  transition: none !important;
}

/* Fullscreen Browser Mode */
#shell.browser-mode.fullscreen {
  position: absolute !important;
  top: 0 !important;
  left: 50% !important;
  right: auto !important;
  bottom: auto !important;
  transform: translateX(-50%) !important;
  width: 100% !important;
  height: 100% !important;
  border-radius: 0 !important;
  border: none !important;
  box-shadow: none !important;
}
#shell.browser-mode.fullscreen #browser-toolbar {
  padding-top: 8px;
}

/* ── BROWSER MODE: PULL UP INTO CAPSULE & CONTRACT TO CIRCLE ── */

/* Step 1: Pull up from full browser into 740x58 Spotlight capsule (strictly centered at left:50%) */
#shell.browser-mode.browser-closing-to-capsule {
  opacity: 1 !important;
  left: 50% !important;
  top: 0 !important;
  width: 740px !important;
  height: 58px !important;
  border-radius: 29px !important;
  transform: translateX(-50%) translateY(var(--collapse-target-y, 70px)) scale(1) !important;
  box-shadow:
    inset 0 1px 1.5px var(--glass-shine),
    inset 0 -1px 1px rgba(0, 0, 0, 0.28) !important;
  transition:
    width 0.26s cubic-bezier(0.16, 1, 0.3, 1),
    height 0.26s cubic-bezier(0.16, 1, 0.3, 1),
    transform 0.26s cubic-bezier(0.16, 1, 0.3, 1),
    border-radius 0.24s ease,
    box-shadow 0.26s ease !important;
  pointer-events: none !important;
}

#shell.browser-mode.browser-closing-to-capsule #browser-view {
  opacity: 0 !important;
  transition: opacity 0.12s ease !important;
  pointer-events: none !important;
}

#shell.browser-mode.browser-closing-to-capsule #search-view {
  display: flex !important;
  opacity: 1 !important;
  transition: opacity 0.15s ease 0.08s !important;
  pointer-events: none !important;
}

#shell.browser-mode.browser-closing-to-capsule .search-input-wrap {
  opacity: 0 !important;
  pointer-events: none !important;
}

/* Step 2: Capsule smoothly contracts horizontally into 58px circle */
#shell.browser-mode.browser-closing-to-circle {
  opacity: 1 !important;
  left: 50% !important;
  top: 0 !important;
  width: 58px !important;
  height: 58px !important;
  border-radius: 29px !important;
  transform: translateX(-50%) translateY(var(--collapse-target-y, 70px)) scale(1) !important;
  box-shadow:
    inset 0 1px 2px rgba(255, 255, 255, 0.45),
    inset 0 -1px 1px rgba(0, 0, 0, 0.28) !important;
  transition:
    width 0.22s cubic-bezier(0.16, 1, 0.3, 1),
    height 0.20s ease,
    border-radius 0.20s ease !important;
  pointer-events: none !important;
}

#shell.browser-mode.browser-closing-to-circle #browser-view {
  display: none !important;
}

#shell.browser-mode.browser-closing-to-circle #search-view {
  display: flex !important;
  opacity: 1 !important;
  pointer-events: none !important;
}

#shell.browser-mode.browser-closing-to-circle .search-input-wrap {
  opacity: 0 !important;
  pointer-events: none !important;
}

/* Step 3: Circle shrinks down into center & dissolves */
#shell.browser-mode.browser-closing-exit {
  opacity: 0 !important;
  left: 50% !important;
  top: 0 !important;
  width: 58px !important;
  height: 58px !important;
  border-radius: 29px !important;
  transform: translateX(-50%) translateY(var(--collapse-target-y, 70px)) scale(0.2) !important;
  pointer-events: none !important;
  transition:
    transform 0.18s cubic-bezier(0.4, 0, 1, 1),
    opacity 0.16s ease !important;
}

#shell.browser-mode.browser-closing-exit #browser-view {
  display: none !important;
}

#shell.browser-mode.browser-closing-exit #search-view {
  display: flex !important;
  opacity: 1 !important;
  pointer-events: none !important;
}

#shell.browser-mode.browser-closing-exit .search-input-wrap {
  opacity: 0 !important;
  pointer-events: none !important;
}

/* Transition from browser back to search mode (via ⌘K / Search button) */
#shell.browser-mode.transitioning-to-search {
  opacity: 1 !important;
  left: 50% !important;
  top: 0 !important;
  width: 740px !important;
  height: 58px !important;
  border-radius: 29px !important;
  transform: translateX(-50%) translateY(var(--collapse-target-y, 70px)) scale(1) !important;
  transition:
    width 0.24s cubic-bezier(0.16, 1, 0.3, 1),
    height 0.24s cubic-bezier(0.16, 1, 0.3, 1),
    transform 0.24s cubic-bezier(0.16, 1, 0.3, 1),
    border-radius 0.22s ease !important;
  pointer-events: none !important;
}

#shell.browser-mode.transitioning-to-search #browser-view {
  opacity: 0 !important;
  transition: opacity 0.12s ease !important;
}

/* ═════════════════════════════════════════════════════════════
   1. SEARCH VIEW & SEARCH BAR
═════════════════════════════════════════════════════════════ */
#search-view {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  overflow: hidden;
  position: relative;
}
#search-view.hidden {
  display: none !important;
}

#search-bar {
  height: 58px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  position: relative;
  -webkit-app-region: drag;
  overflow: hidden;
}

/* Search icon: exactly centered when width is 58px (18+22+18=58), glides left as pill expands */
.search-icon-wrap {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--accent);
  z-index: 10;
  pointer-events: none;
  transition: transform 0.2s ease, color 0.2s ease;
}
#search-bar:focus-within .search-icon-wrap {
  transform: translateY(-50%) scale(1.12);
}
.search-icon {
  width: 20px;
  height: 20px;
  filter: drop-shadow(0 0 8px var(--accent-glow));
}

/* Input & Trailing controls */
.search-input-wrap {
  position: absolute;
  left: 52px;
  right: 18px;
  top: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  opacity: 0;
  transform: translateX(8px);
  pointer-events: none;
  transition: opacity 0.15s ease, transform 0.18s var(--spring);
}

#shell.search-mode.state-expanded .search-input-wrap,
#shell.search-mode.has-results .search-input-wrap {
  opacity: 1 !important;
  transform: translateX(0) !important;
  pointer-events: auto !important;
  transition: opacity 0.20s ease 0.08s, transform 0.22s var(--spring) 0.08s !important;
}

#shell.search-mode.state-collapsing .search-input-wrap,
#shell.search-mode.state-collapsing-exit .search-input-wrap,
#shell.search-mode.state-circle .search-input-wrap,
#shell.search-mode.state-hidden .search-input-wrap {
  opacity: 0 !important;
  transform: translateX(8px) !important;
  pointer-events: none !important;
  transition: opacity 0.08s ease, transform 0.08s ease !important;
}

.search-field-container {
  flex: 1;
  min-width: 0;
  position: relative;
  height: 100%;
  display: flex;
  align-items: center;
}

#search-input {
  width: 100%;
  background: none;
  border: none;
  outline: none;
  color: var(--text-main);
  font-size: 18px;
  font-weight: 400;
  font-family: inherit;
  letter-spacing: -0.015em;
  caret-color: var(--accent);
  -webkit-app-region: no-drag;
  position: relative;
  z-index: 2;
  padding: 0;
  margin: 0;
  line-height: normal;
}
#search-input::placeholder {
  color: var(--text-muted);
  font-weight: 400;
}

.search-ghost {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 100%;
  font-size: 18px;
  font-weight: 400;
  font-family: inherit;
  letter-spacing: -0.015em;
  line-height: normal;
  pointer-events: none;
  white-space: pre;
  overflow: hidden;
  z-index: 1;
  display: none;
  align-items: center;
  user-select: none;
}
.search-ghost.visible {
  display: flex;
}
.ghost-typed {
  opacity: 0;
  visibility: hidden;
  white-space: pre;
}
.ghost-completion {
  color: var(--text-muted);
  opacity: 0.62;
  white-space: pre;
  letter-spacing: -0.015em;
}
.ghost-tab-hint {
  display: inline-flex;
  align-items: center;
  margin-left: 9px;
  padding: 1.5px 5.5px;
  border-radius: 5px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.03em;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: var(--text-muted);
  opacity: 0.85;
  white-space: nowrap;
}

.search-trailing {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  -webkit-app-region: no-drag;
}

.search-settings-btn {
  width: 26px;
  height: 26px;
  border-radius: 7px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
  -webkit-app-region: no-drag;
}
.search-settings-btn:hover {
  background: rgba(255, 255, 255, 0.15);
  color: var(--text-main);
  transform: translateY(-1px);
}
.search-settings-btn svg {
  width: 14px;
  height: 14px;
}

.resume-pill-btn {
  display: none;
  align-items: center;
  gap: 6px;
  height: 26px;
  max-width: 175px;
  padding: 0 11px;
  border-radius: 13px;
  border: 1px solid var(--glass-border);
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: inset 0 1px 1px var(--glass-shine), 0 2px 6px rgba(0, 0, 0, 0.25);
  color: var(--text-main);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
  white-space: nowrap;
  overflow: hidden;
  -webkit-app-region: no-drag;
}
#resume-page-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 120px;
}
.resume-pill-btn:hover {
  background: rgba(255, 255, 255, 0.15);
  border-color: var(--accent);
  color: var(--text-main);
  box-shadow: inset 0 1px 1.5px var(--glass-shine), 0 0 12px var(--accent-glow);
  transform: translateY(-1px);
}
.pulse-indicator {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #34d399;
  box-shadow: 0 0 8px #34d399;
  animation: pulseGlow 1.8s infinite;
  flex-shrink: 0;
}
@keyframes pulseGlow {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.35; transform: scale(0.85); }
}

.shortcut-badge {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 7px;
  padding: 2.5px 8px;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

/* ── Results Dropdown ── */
#results-panel {
  display: none;
  flex: 1;
  min-height: 0;
  flex-direction: column;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transform: translateY(-8px);
  transition: opacity 0.22s ease, transform 0.25s var(--spring);
  background: rgba(0, 0, 0, 0.16);
}
#shell.search-mode.has-results #results-panel.visible,
#results-panel.visible {
  display: flex !important;
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

#results-divider {
  height: 1px;
  background: rgba(255, 255, 255, 0.08);
  flex-shrink: 0;
}

#results-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  scrollbar-width: none;
}
#results-list::-webkit-scrollbar { display: none; }

.section-label {
  padding: 6px 14px 2px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.result-item {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 9px 12px;
  border-radius: 12px;
  cursor: default;
  position: relative;
  transition: background 0.14s ease, border-color 0.14s ease, transform 0.12s ease;
  border: 1px solid transparent;
  animation: itemSlideIn 0.22s var(--spring) both;
  animation-delay: calc(var(--i, 0) * 20ms);
}
@keyframes itemSlideIn {
  from { opacity: 0; transform: translateY(-6px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.result-item:hover {
  background: rgba(255, 255, 255, 0.06);
}
.result-item.selected {
  background: rgba(124, 143, 255, 0.18);
  border-color: rgba(124, 143, 255, 0.32);
}
.result-item:active {
  transform: scale(0.988);
}

.item-favicon {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.07);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  flex-shrink: 0;
  overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
.item-favicon img {
  width: 20px;
  height: 20px;
  object-fit: contain;
}

.item-details {
  flex: 1;
  min-width: 0;
}
.item-title {
  font-size: 13.8px;
  font-weight: 500;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
mark,
.item-title mark,
.url-suggestion-text mark {
  background: transparent !important;
  color: inherit !important;
  font-weight: inherit !important;
}
.item-url {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.item-badge {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2.5px 8px;
  border-radius: 20px;
  flex-shrink: 0;
}
.badge-active {
  background: rgba(52, 211, 153, 0.2);
  color: #34d399;
  border: 1px solid rgba(52, 211, 153, 0.35);
  box-shadow: 0 0 10px rgba(52, 211, 153, 0.2);
}
.badge-top {
  background: linear-gradient(135deg, rgba(124, 143, 255, 0.28), rgba(196, 170, 255, 0.28));
  color: #c4d0ff;
  border: 1px solid rgba(124, 143, 255, 0.35);
  box-shadow: 0 0 12px rgba(124, 143, 255, 0.2);
}
.badge-hist {
  background: rgba(196, 170, 255, 0.14);
  color: var(--accent2);
}
.badge-web {
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-muted);
}
.badge-google {
  background: rgba(66, 133, 244, 0.22);
  color: #8ab4f8;
  border: 1px solid rgba(66, 133, 244, 0.35);
  box-shadow: 0 0 10px rgba(66, 133, 244, 0.18);
}

#results-footer {
  padding: 8px 18px;
  flex-shrink: 0;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 16px;
  background: rgba(0, 0, 0, 0.15);
}
.footer-hint {
  display: flex;
  align-items: center;
  gap: 4px;
}
.footer-hint kbd {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 5px;
  padding: 1px 5px;
  font-family: inherit;
  font-size: 10px;
  color: rgba(255, 255, 255, 0.7);
}

/* ═════════════════════════════════════════════════════════════
   SETTINGS PANEL & OVERLAY
═════════════════════════════════════════════════════════════ */
#settings-panel {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  border-top: none;
  background: transparent;
}
#settings-panel.hidden {
  display: none !important;
}
#shell.search-mode.has-settings #settings-panel {
  border-top: none !important;
  height: 100% !important;
  width: 100% !important;
}

/* Browser Mode Settings Modal Overlay */
.settings-browser-overlay {
  position: absolute;
  inset: 0;
  z-index: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease;
}
.settings-browser-overlay.visible {
  opacity: 1;
  pointer-events: auto;
}
.settings-modal-card {
  width: 660px;
  max-width: 92%;
  height: 490px;
  max-height: 88%;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  box-shadow: 0 28px 70px rgba(0, 0, 0, 0.65), inset 0 1px 1.5px var(--glass-shine);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: scale(0.93) translateY(8px);
  transition: transform 0.24s var(--spring);
}
.settings-browser-overlay.visible .settings-modal-card {
  transform: scale(1) translateY(0);
}

/* Settings Container & Headers */
.settings-wrap {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
.settings-header-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  flex-shrink: 0;
  -webkit-app-region: drag;
}
.settings-header-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-main);
  letter-spacing: -0.01em;
  user-select: none;
}
.settings-header-title svg {
  width: 17px;
  height: 17px;
  color: var(--accent);
}
.settings-modal-close-btn {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s ease;
  -webkit-app-region: no-drag;
}
.settings-modal-close-btn:hover {
  background: rgba(255, 255, 255, 0.18);
  color: #ffffff;
  transform: scale(1.05);
}
.settings-nav-tab,
.settings-content-area,
.theme-card,
.engine-card,
.shortcut-record-btn,
.general-toggle,
.general-option-row {
  -webkit-app-region: no-drag;
}

/* Settings Tabs */
.settings-tabs-bar {
  display: flex;
  gap: 6px;
  padding: 8px 20px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  flex-shrink: 0;
}
.settings-nav-tab {
  padding: 7px 14px;
  border-radius: 8px 8px 0 0;
  border: 1px solid transparent;
  border-bottom: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s ease;
}
.settings-nav-tab:hover {
  color: var(--text-main);
  background: rgba(255, 255, 255, 0.05);
}
.settings-nav-tab.active {
  color: var(--accent);
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.12);
  border-bottom: 2px solid var(--accent);
  font-weight: 600;
}

/* Content Area */
.settings-content-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.15) transparent;
}
.settings-tab-pane {
  display: none;
  flex-direction: column;
  gap: 12px;
}
.settings-tab-pane.active {
  display: flex;
}
.settings-section-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 2px;
}

/* Theme Cards Grid */
.theme-options-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
}
.theme-card {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1.5px solid var(--card-border, rgba(255, 255, 255, 0.09));
  background: var(--card-bg, rgba(255, 255, 255, 0.04));
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 7px;
  transition: all 0.16s ease;
  position: relative;
}
.theme-card:hover {
  border-color: rgba(255, 255, 255, 0.28);
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
}
.theme-card.active {
  border-color: var(--accent);
  background: rgba(124, 143, 255, 0.14);
  box-shadow: 0 0 0 1px var(--accent), 0 6px 18px var(--accent-glow);
}
.theme-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.theme-preview-dots {
  display: flex;
  align-items: center;
  gap: 5px;
}
.theme-dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.2);
}
.theme-card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-main);
}
.theme-card-desc {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.35;
}
.theme-active-badge {
  font-size: 9.5px;
  padding: 2px 6px;
  border-radius: 10px;
  background: var(--accent);
  color: #0b0d18;
  font-weight: 700;
  display: none;
}
.theme-card.active .theme-active-badge {
  display: inline-block;
}

/* Engine Cards List */
.engine-options-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.engine-card {
  padding: 11px 14px;
  border-radius: 11px;
  border: 1.5px solid var(--card-border, rgba(255, 255, 255, 0.08));
  background: var(--card-bg, rgba(255, 255, 255, 0.04));
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.15s ease;
}
.engine-card:hover {
  border-color: rgba(255, 255, 255, 0.25);
  background: rgba(255, 255, 255, 0.08);
}
.engine-card.active {
  border-color: var(--accent);
  background: rgba(124, 143, 255, 0.12);
}
.engine-card-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.engine-icon {
  font-size: 18px;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 7px;
}
.engine-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.engine-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-main);
}
.engine-desc {
  font-size: 11px;
  color: var(--text-muted);
}
.engine-radio {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  flex-shrink: 0;
}
.engine-card.active .engine-radio {
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent-glow);
}
.engine-card.active .engine-radio::after {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #0b0d18;
}

/* General Options */
.general-option-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-radius: 11px;
  background: var(--card-bg, rgba(255, 255, 255, 0.04));
  border: 1px solid var(--card-border, rgba(255, 255, 255, 0.08));
}
.general-option-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.general-option-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-main);
}
.general-option-hint {
  font-size: 11px;
  color: var(--text-muted);
}
.toggle-switch {
  position: relative;
  width: 42px;
  height: 24px;
  cursor: pointer;
  flex-shrink: 0;
}
.toggle-switch input {
  opacity: 0;
  width: 0;
  height: 0;
}
.toggle-slider {
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0.18);
  border-radius: 24px;
  transition: all 0.2s ease;
}
.toggle-slider::before {
  position: absolute;
  content: '';
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 3px;
  background: white;
  border-radius: 50%;
  transition: all 0.2s var(--spring);
}
.toggle-switch input:checked + .toggle-slider {
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow);
}
.toggle-switch input:checked + .toggle-slider::before {
  transform: translateX(18px);
}
.btn-clear-history {
  padding: 6px 13px;
  border-radius: 8px;
  border: 1px solid rgba(239, 68, 68, 0.35);
  background: rgba(239, 68, 68, 0.14);
  color: #fca5a5;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  flex-shrink: 0;
}
.btn-clear-history:hover {
  background: rgba(239, 68, 68, 0.26);
  color: #ffffff;
}
.status-pill {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.active-pill {
  background: rgba(16, 185, 129, 0.16);
  color: #34d399;
  border: 1px solid rgba(16, 185, 129, 0.35);
}
/* Interactive Shortcut Configurator */
.shortcuts-actions-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.btn-reset-shortcuts {
  padding: 5px 11px;
  border-radius: 7px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
}
.btn-reset-shortcuts:hover {
  background: rgba(255, 255, 255, 0.12);
  color: var(--text-main);
  border-color: rgba(255, 255, 255, 0.28);
}
.shortcuts-config-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.shortcut-config-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: var(--card-bg, rgba(255, 255, 255, 0.04));
  border: 1px solid var(--card-border, rgba(255, 255, 255, 0.08));
  border-radius: 11px;
  transition: all 0.15s ease;
}
.shortcut-config-row:hover {
  background: rgba(255, 255, 255, 0.07);
  border-color: rgba(255, 255, 255, 0.18);
}
.shortcut-config-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.shortcut-config-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-main);
}
.shortcut-config-scope {
  font-size: 11px;
  color: var(--text-muted);
}
.shortcut-record-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 8px;
  border: 1.5px solid rgba(255, 255, 255, 0.16);
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-main);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s ease;
  min-width: 120px;
  justify-content: center;
}
.shortcut-record-btn:hover {
  border-color: var(--accent);
  background: rgba(255, 255, 255, 0.14);
  transform: translateY(-1px);
}
.shortcut-record-btn.recording {
  border-color: var(--accent);
  background: var(--accent-glow);
  color: #ffffff;
  animation: pulse-recording 1.2s infinite ease-in-out;
}
@keyframes pulse-recording {
  0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
  50% { box-shadow: 0 0 0 6px var(--accent-glow); }
}
.shortcut-record-btn kbd {
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 5px;
  padding: 2px 6px;
  font-size: 11px;
  color: var(--text-main);
  font-family: inherit;
}

/* Cross-Platform Scrollbars */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.18);
  border-radius: 6px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.35);
}

/* ═════════════════════════════════════════════════════════════
   2. BROWSER VIEW (MULTI-TAB WORKSPACE)
═════════════════════════════════════════════════════════════ */
#browser-view {
  display: none;
  flex-direction: column;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  transition: opacity 0.14s ease;
}
#browser-view.active {
  display: flex !important;
}

#browser-toolbar {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--glass-bg);
  backdrop-filter: blur(52px) saturate(210%);
  -webkit-backdrop-filter: blur(52px) saturate(210%);
  border-bottom: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 1.5px var(--glass-shine);
  position: relative;
  -webkit-app-region: drag;
  z-index: 100;
}
body[data-theme="apple-liquid"] #browser-toolbar {
  background: rgba(255, 255, 255, 0.45) !important;
  border-bottom: 1px solid rgba(0, 0, 0, 0.08) !important;
  box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.95) !important;
}

.toolbar-tabs-tier {
  height: 42px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 10px;
}

.nav-buttons-group {
  display: flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
  -webkit-app-region: no-drag;
}
.nav-icon-btn {
  width: 26px;
  height: 26px;
  border-radius: 7px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: default;
  transition: background 0.12s ease, transform 0.08s ease, opacity 0.12s ease;
}
.nav-icon-btn svg { width: 13px; height: 13px; }
.nav-icon-btn:hover { background: rgba(255, 255, 255, 0.14); }
.nav-icon-btn:active { transform: scale(0.9); }
.nav-icon-btn:disabled { opacity: 0.22; pointer-events: none; }

#tabs-strip {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 0 4px;
  -webkit-app-region: no-drag;
}
#tabs-strip::-webkit-scrollbar { display: none; }

.glass-tab {
  height: 30px;
  max-width: 180px;
  min-width: 90px;
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 11px;
  border-radius: 9px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  color: var(--text-muted);
  font-size: 12px;
  cursor: default;
  position: relative;
  box-shadow: inset 0 1px 1px var(--glass-shine);
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
}
.glass-tab:hover {
  background: rgba(255, 255, 255, 0.12);
  color: var(--text-main);
}
.glass-tab.active {
  background: rgba(255, 255, 255, 0.18);
  border-color: var(--accent);
  color: var(--text-main);
  box-shadow: 0 0 14px var(--accent-glow), inset 0 1px 1.5px var(--glass-shine);
}

.tab-favicon {
  width: 15px;
  height: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}
.tab-favicon img {
  width: 14px;
  height: 14px;
  object-fit: contain;
}

.tab-title {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
}

.tab-close-btn {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--text-muted);
  transition: background 0.12s ease, color 0.12s ease;
  flex-shrink: 0;
}
.tab-close-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  color: #fff;
}
.glass-tab.active .tab-close-btn:hover {
  background: rgba(239, 68, 68, 0.3);
  color: #fca5a5;
}

.btn-tab-add {
  width: 26px;
  height: 26px;
  border-radius: 7px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: default;
  transition: background 0.12s ease, transform 0.08s ease;
  flex-shrink: 0;
  -webkit-app-region: no-drag;
}
.btn-tab-add svg { width: 14px; height: 14px; }
.btn-tab-add:hover { background: rgba(124, 143, 255, 0.2); color: var(--accent); }
.btn-tab-add:active { transform: scale(0.92); }

.btn-incognito-add {
  margin-left: 2px;
}
.btn-incognito-add:hover {
  background: rgba(168, 85, 247, 0.25) !important;
  color: #c084fc !important;
  border-color: rgba(168, 85, 247, 0.5) !important;
  box-shadow: 0 0 12px rgba(168, 85, 247, 0.35) !important;
}

/* Private / Incognito Tab Styling */
.glass-tab.private-tab {
  background: rgba(88, 28, 135, 0.28) !important;
  border-color: rgba(168, 85, 247, 0.38) !important;
}
.glass-tab.private-tab:hover {
  background: rgba(88, 28, 135, 0.42) !important;
  border-color: rgba(168, 85, 247, 0.58) !important;
}
.glass-tab.private-tab.active {
  background: rgba(107, 33, 168, 0.55) !important;
  border-color: #a855f7 !important;
  box-shadow: 0 4px 18px rgba(168, 85, 247, 0.35), inset 0 1px 1.5px rgba(233, 213, 255, 0.4) !important;
  color: #faf5ff !important;
}
.tab-private-badge {
  font-size: 11px;
  margin-right: 4px;
  flex-shrink: 0;
  opacity: 0.95;
}

/* Incognito Badge in URL bar */
.incognito-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  background: rgba(168, 85, 247, 0.22);
  border: 1px solid rgba(168, 85, 247, 0.42);
  color: #d8b4fe;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: -0.1px;
  flex-shrink: 0;
  margin-right: 6px;
  box-shadow: 0 0 10px rgba(168, 85, 247, 0.25);
}
.incognito-badge.hidden {
  display: none !important;
}

/* Light theme overrides for Private Tabs */
body[data-theme="apple-liquid"] .btn-incognito-add:hover,
body[data-theme="apple-vision-light"] .btn-incognito-add:hover {
  background: rgba(147, 51, 234, 0.14) !important;
  color: #7e22ce !important;
  border-color: rgba(147, 51, 234, 0.35) !important;
}
body[data-theme="apple-liquid"] .glass-tab.private-tab,
body[data-theme="apple-vision-light"] .glass-tab.private-tab {
  background: rgba(243, 232, 255, 0.65) !important;
  border-color: rgba(147, 51, 234, 0.25) !important;
  color: #581c87 !important;
}
body[data-theme="apple-liquid"] .glass-tab.private-tab.active,
body[data-theme="apple-vision-light"] .glass-tab.private-tab.active {
  background: rgba(250, 245, 255, 0.95) !important;
  border-color: #9333ea !important;
  color: #581c87 !important;
  box-shadow: 0 4px 16px rgba(147, 51, 234, 0.22), inset 0 1px 2px #ffffff !important;
}
body[data-theme="apple-liquid"] .incognito-badge,
body[data-theme="apple-vision-light"] .incognito-badge {
  background: rgba(147, 51, 234, 0.12) !important;
  border-color: rgba(147, 51, 234, 0.30) !important;
  color: #6b21a8 !important;
}

.toolbar-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  -webkit-app-region: no-drag;
}
.action-search-btn {
  height: 26px;
  padding: 0 9px;
  display: flex;
  align-items: center;
  gap: 5px;
  border-radius: 7px;
  border: 1px solid rgba(124, 143, 255, 0.3);
  background: rgba(124, 143, 255, 0.14);
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  cursor: default;
  transition: background 0.12s ease, transform 0.08s ease;
}
.action-search-btn svg { width: 12px; height: 12px; }
.action-search-btn:hover { background: rgba(124, 143, 255, 0.24); }

.action-fullscreen-btn {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: default;
  transition: background 0.12s ease, color 0.12s ease;
}
.action-fullscreen-btn:hover {
  background: rgba(255, 255, 255, 0.16);
  color: var(--text-main);
}
.action-fullscreen-btn svg {
  width: 12px;
  height: 12px;
}

.action-close-btn {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-muted);
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: default;
  transition: background 0.12s ease, color 0.12s ease;
}
.action-close-btn:hover {
  background: rgba(239, 68, 68, 0.25);
  color: #fca5a5;
}

.toolbar-url-tier {
  height: 36px;
  display: flex;
  align-items: center;
  padding: 0 14px 4px;
  position: relative;
}
#browser-url-bar {
  flex: 1;
  height: 34px;
  background: var(--card-bg);
  border: 1px solid var(--glass-border);
  border-radius: 17px;
  padding: 0 8px 0 12px;
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 13px;
  color: var(--text-main);
  cursor: text;
  white-space: nowrap;
  position: relative;
  -webkit-app-region: no-drag;
  box-shadow: inset 0 1px 1.5px var(--glass-shine);
  transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, color 0.18s ease;
}
#browser-url-bar:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: var(--accent);
}
#browser-url-bar.editing {
  background: rgba(255, 255, 255, 0.15);
  border-color: var(--accent);
  box-shadow: 0 0 0 2.5px var(--accent-glow), inset 0 1px 1.5px var(--glass-shine);
  color: var(--text-main);
}
body[data-theme="apple-liquid"] #browser-url-bar {
  background: rgba(255, 255, 255, 0.70) !important;
  border: 1px solid rgba(0, 0, 0, 0.12) !important;
  color: #1d1d1f !important;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04) !important;
}
body[data-theme="apple-liquid"] #browser-url-bar:hover {
  background: rgba(255, 255, 255, 0.90) !important;
  border-color: #007aff !important;
}
body[data-theme="apple-liquid"] #browser-url-bar.editing {
  background: #ffffff !important;
  border-color: #007aff !important;
  box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.22) !important;
  color: #000000 !important;
}
.lock-icon {
  width: 13px;
  height: 13px;
  color: #34d399;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  cursor: pointer;
  transition: transform 0.15s ease, opacity 0.15s ease;
}
.lock-icon:hover {
  transform: scale(1.15);
  opacity: 0.85;
}
#url-text {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;

/* Gesture Swipe Indicator (Two-finger trackpad navigation) */
.gesture-swipe-indicator {
  position: absolute;
  top: 50%;
  transform: translateY(-50%) scale(0.85);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--glass-bg);
  backdrop-filter: blur(48px) saturate(210%);
  -webkit-backdrop-filter: blur(48px) saturate(210%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), inset 0 1px 1.5px var(--glass-shine);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-main);
  z-index: 2200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.20s ease, transform 0.22s var(--spring), background 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
}
.gesture-swipe-indicator svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  stroke-width: 2.5;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.gesture-swipe-indicator.left {
  left: 20px;
}
.gesture-swipe-indicator.right {
  right: 20px;
}
.gesture-swipe-indicator.visible {
  opacity: 1;
  transform: translateY(-50%) scale(1);
}
.gesture-swipe-indicator.flash {
  transform: translateY(-50%) scale(1.15);
  opacity: 1;
  background: var(--glass-bg) !important;
  border-color: var(--accent) !important;
  color: var(--accent) !important;
  box-shadow: 0 0 30px var(--accent-glow), 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 1px 1.5px var(--glass-shine) !important;
}
.gesture-swipe-indicator.edge-warning {
  opacity: 0.55;
  transform: translateY(-50%) scale(0.92);
}

/* Glass Toast Notification */
.glass-toast {
  position: absolute;
  top: 76px;
  left: 50%;
  transform: translateX(-50%) translateY(-10px);
  background: var(--glass-bg);
  backdrop-filter: blur(48px) saturate(200%);
  -webkit-backdrop-filter: blur(48px) saturate(200%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45), inset 0 1px 1.5px var(--glass-shine);
  color: var(--text-main);
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 12.5px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 2500;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}
.glass-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.glass-toast.hidden {
  display: none !important;
}
body[data-theme="apple-liquid"] .glass-toast,
body[data-theme="apple-vision-light"] .glass-toast {
  background: rgba(255, 255, 255, 0.94) !important;
  color: #1d1d1f !important;
  border: 1px solid rgba(0, 0, 0, 0.12) !important;
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.15), inset 0 1px 2px #ffffff !important;
}


#browser-progress-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2.2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--cyan), var(--accent));
  background-size: 200% 100%;
  transform: scaleX(0);
  transform-origin: left;
  opacity: 0;
  transition: transform 0.35s var(--smooth), opacity 0.25s ease;
}
#browser-progress-bar.loading {
  opacity: 1;
  animation: progressShimmer 1.5s linear infinite;
}
@keyframes progressShimmer {
  0%   { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}

#webview-wrapper {
  flex: 1;
  width: 100%;
  height: 100%;
  min-height: 0;
  position: relative;
  display: flex;
  background: var(--browser-bg);
  overflow: hidden;
  transition: background 0.25s ease;
}

#page-loader {
  position: absolute;
  inset: 0;
  z-index: 15;
  background: var(--browser-bg);
  backdrop-filter: blur(48px) saturate(210%);
  -webkit-backdrop-filter: blur(48px) saturate(210%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.30s ease;
}
#page-loader.hidden {
  opacity: 0;
  pointer-events: none;
}
.loader-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 15px;
  padding: 24px 38px;
  border-radius: 22px;
  background: var(--glass-bg);
  backdrop-filter: blur(50px) saturate(210%);
  -webkit-backdrop-filter: blur(50px) saturate(210%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 20px 48px rgba(0, 0, 0, 0.40), inset 0 1px 1.5px var(--glass-shine);
  min-width: 175px;
  transform: scale(1);
  transition: transform 0.25s var(--smooth);
}
.spinner-ring {
  width: 38px;
  height: 38px;
  border: 3.5px solid rgba(255, 255, 255, 0.12);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spinRing 0.75s linear infinite;
  box-shadow: 0 0 16px var(--accent-glow);
}
@keyframes spinRing { to { transform: rotate(360deg); } }
.loader-label {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text-main);
  letter-spacing: -0.15px;
}

.tab-webview {
  flex: 1;
  width: 100%;
  height: 100%;
  min-height: 0;
  border: none;
  outline: none;
  display: none;
  background: var(--browser-bg);
}
.tab-webview.active {
  display: flex !important;
}

#btn-nav-reload.loading svg {
  animation: spinReload 0.85s linear infinite;
  color: var(--accent) !important;
}
@keyframes spinReload {
  to { transform: rotate(360deg); }
}

function isMacOS() {
  return (window.GlassAPI?.platform === 'darwin') || navigator.platform.toUpperCase().indexOf('MAC') >= 0;
}

function formatShortcutForDisplay(shortcutStr) {
  if (!shortcutStr) return '';
  const isMac = isMacOS();
  const parts = shortcutStr.split('+').map(p => p.trim());

  return parts.map(part => {
    const p = part.toLowerCase();
    if (p === 'commandorcontrol' || p === 'cmdorctrl') {
      return isMac ? '⌘' : 'Ctrl';
    }
    if (p === 'alt' || p === 'option') {
      return isMac ? '⌥' : 'Alt';
    }
    if (p === 'control' || p === 'ctrl') {
      return isMac ? '⌃' : 'Ctrl';
    }
    if (p === 'shift') {
      return isMac ? '⇧' : 'Shift';
    }
    if (p === 'meta' || p === 'command' || p === 'cmd') {
      return isMac ? '⌘' : 'Win';
    }
    if (p === 'space') {
      return 'Space';
    }
    return part.toUpperCase();
  }).join(isMac ? ' ' : ' + ');
}

function matchesShortcut(e, shortcutStr) {
  if (!shortcutStr) return false;
  const isMac = isMacOS();
  const parts = shortcutStr.split('+').map(p => p.trim());

  let reqCtrl = false;
  let reqAlt = false;
  let reqShift = false;
  let reqMeta = false;
  let reqKey = '';

  for (const part of parts) {
    const p = part.toLowerCase();
    if (p === 'commandorcontrol' || p === 'cmdorctrl') {
      if (isMac) reqMeta = true;
      else reqCtrl = true;
    } else if (p === 'ctrl' || p === 'control') {
      reqCtrl = true;
    } else if (p === 'alt' || p === 'option') {
      reqAlt = true;
    } else if (p === 'shift') {
      reqShift = true;
    } else if (p === 'meta' || p === 'command' || p === 'cmd') {
      reqMeta = true;
    } else {
      reqKey = p;
    }
  }

  if (e.ctrlKey !== reqCtrl) return false;
  if (e.altKey !== reqAlt) return false;
  if (e.shiftKey !== reqShift) return false;
  if (e.metaKey !== reqMeta) return false;

  const pressedKey = (e.key || '').toLowerCase();
  const pressedCode = (e.code || '').toLowerCase();

  if (reqKey === 'space') {
    return pressedKey === ' ' || pressedCode === 'space';
  }
  if (reqKey === ',') {
    return pressedKey === ',' || pressedCode === 'comma';
  }
  return pressedKey === reqKey || pressedCode === 'key' + reqKey || pressedCode === reqKey;
}

function recordVisit(url) {
  if (!state.settings.saveHistory) return;
  const activeTab = (typeof getActiveTab === 'function') ? getActiveTab() : null;
  if (activeTab && activeTab.isPrivate) return;
  const idx = state.history.findIndex(h => h.url === url);
  if (idx >= 0) {
    state.history[idx].count++;
    state.history[idx].timestamp = Date.now();
  } else {
    let hostname = '';
    try {
      hostname = new URL(url).hostname.replace(/^www\./, '');
    } catch (e) {}
    const matched = SITES.find(s => s.url === url || s.domain === hostname);
    state.history.push({
      url,
      name: matched?.name || hostname || url,
      domain: hostname || matched?.domain || '',
      icon: matched?.icon || '🌐',
      count: 1,
      timestamp: Date.now(),
    });
  }
  localStorage.setItem('glass_history', JSON.stringify(state.history));
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// ── Smart Autocomplete Matcher ────────────────────────────────
function findAutocomplete(query) {
  if (!query) return null;
  const q = query.toLowerCase().trim();
  if (!q) return null;

  if (query.includes(' ') || q.startsWith('yt ') || q.startsWith('youtube ')) {
    return null;
  }

  let cleanQ = q;
  if (cleanQ.startsWith('https://')) cleanQ = cleanQ.slice(8);
  else if (cleanQ.startsWith('http://')) cleanQ = cleanQ.slice(7);
  if (cleanQ.startsWith('www.')) cleanQ = cleanQ.slice(4);

  if (!cleanQ) return null;

  // 1. Check history for previously visited domain or URL prefix
  if (state.history && state.history.length > 0) {
    for (const h of state.history) {
      if (!h.url) continue;
      try {
        const u = new URL(h.url);
        let d = u.hostname.toLowerCase();
        if (d.startsWith('www.')) d = d.slice(4);
        if (d.startsWith(cleanQ) && d !== cleanQ) {
          const matchedSite = SITES.find(s => s.domain === d);
          return {
            domain: d,
            url: h.url,
            name: matchedSite?.name || h.name || d,
            icon: matchedSite?.icon || h.icon || '🌐',
            suffix: d.slice(cleanQ.length),
            isHistory: true,
          };
        }
      } catch (e) {}
    }
  }

  // 2. Check SITES by domain prefix (e.g. "inst" -> "instagram.com", "git" -> "github.com", "face" -> "facebook.com")
  for (const site of SITES) {
    const d = site.domain.toLowerCase();
    if (d.startsWith(cleanQ) && d !== cleanQ) {
      return {
        domain: site.domain,
        url: site.url,
        name: site.name,
        icon: site.icon,
        suffix: site.domain.slice(cleanQ.length),
        site,
      };
    }
  }

  // 3. Check SITES by site name prefix (e.g. "insta" -> name "Instagram" -> "instagram.com")
  for (const site of SITES) {
    const n = site.name.toLowerCase();
    if (n.startsWith(cleanQ)) {
      const d = site.domain.toLowerCase();
      if (d.startsWith(cleanQ) && d !== cleanQ) {
        return {
          domain: site.domain,
          url: site.url,
          name: site.name,
          icon: site.icon,
          suffix: site.domain.slice(cleanQ.length),
          site,
        };
      }
    }
  }

  // 4. Check keywords (e.g. "fb" -> Facebook, "gh" -> GitHub, "yt" -> YouTube, "ig" -> Instagram)
  for (const site of SITES) {
    if (site.keywords && site.keywords.includes(cleanQ)) {
      return {
        domain: site.domain,
        url: site.url,
        name: site.name,
        icon: site.icon,
        suffix: '',
        isKeywordMatch: true,
        site,
      };
    }
  }

  return null;
}

function clearGhost() {
  if ($searchGhost) {
    $searchGhost.classList.remove('visible');
    $searchGhost.innerHTML = '';
  }
  state.currentAutocomplete = null;
  if ($footerTabHint) {
    $footerTabHint.style.display = 'none';
  }
}

function updateGhost(query) {
  if (!query || !query.trim()) {
    clearGhost();
    return null;
  }
  const match = findAutocomplete(query);
  if (match && match.suffix) {
    state.currentAutocomplete = match;
    if ($searchGhost) {
      $searchGhost.innerHTML = `<span class="ghost-typed">${escapeHtml(query)}</span><span class="ghost-completion">${escapeHtml(match.suffix)}</span><span class="ghost-tab-hint">Tab ⇥</span>`;
      $searchGhost.classList.add('visible');
    }
    if ($footerTabHint) {
      $footerTabHint.style.display = 'inline-flex';
    }
    return match;
  } else {
    clearGhost();
    return match;
  }
}

// ── Smart query search ────────────────────────────────────────
function buildResults(query) {
  const q = query.toLowerCase().trim();

  // If query is empty, do not return results (keeps search bar pure 58px capsule)
  if (!q) {
    return [];
  }

  const results = [];
  const ac = findAutocomplete(query);

  // 1. Top site match from autocomplete
  if (ac) {
    results.push({
      name: ac.name,
      url: ac.url,
      icon: ac.icon,
      badge: ac.isHistory ? 'hist' : 'top',
      subtitle: ac.domain,
      isTopMatch: true,
    });
  }

  // 2. Direct URL navigation
  const isUrl = (q.includes('.') && !q.includes(' ')) || q.startsWith('http://') || q.startsWith('https://');
  if (isUrl) {
    const directUrl = q.startsWith('http') ? q : 'https://' + q;
    if (!ac || (ac.url !== directUrl && !directUrl.endsWith('/' + ac.domain))) {
      results.push({
        name: `Go to web address: ${q}`,
        url: directUrl,
        icon: '🌐',
        badge: 'top',
        subtitle: directUrl,
        direct: true,
      });
    }
  }

  // 3. YouTube prefix commands
  if (q.startsWith('yt ') || q.startsWith('youtube ')) {
    const searchTerm = query.replace(/^(yt|youtube)\s+/i, '').trim();
    if (searchTerm) {
      results.push({
        name: `YouTube search: “${searchTerm}”`,
        url: `https://www.youtube.com/results?search_query=${encodeURIComponent(searchTerm)}`,
        icon: '🎬',
        badge: 'top',
      });
    }
  }

  // 4. Default Search Engine item
  const selectedEngineKey = state.settings?.searchEngine || 'google';
  const engine = SEARCH_ENGINES[selectedEngineKey] || SEARCH_ENGINES.google;
  const engineSearchItem = {
    name: `${engine.name} search: “${query}”`,
    url: engine.url(query),
    icon: engine.icon,
    badge: 'web',
    subtitle: `${engine.name} Web Search`,
    isSearch: true,
  };
  results.push(engineSearchItem);

  // 5. Curated / History secondary matches
  let cleanQ = q;
  if (cleanQ.startsWith('https://')) cleanQ = cleanQ.slice(8);
  else if (cleanQ.startsWith('http://')) cleanQ = cleanQ.slice(7);
  if (cleanQ.startsWith('www.')) cleanQ = cleanQ.slice(4);

  const scored = SITES.map(site => {
    if (results.some(r => r.url === site.url)) return null;

    let score = 0;
    const nameLower = site.name.toLowerCase();
    const domainLower = site.domain.toLowerCase();

    if (nameLower === cleanQ || domainLower === cleanQ) score += 200;
    else if (domainLower.startsWith(cleanQ)) score += 150;
    else if (nameLower.startsWith(cleanQ)) score += 130;
    else if (cleanQ.length >= 3 && domainLower.includes(cleanQ)) score += 60;
    else if (cleanQ.length >= 3 && nameLower.includes(cleanQ)) score += 40;

    site.keywords.forEach(kw => {
      if (kw === cleanQ) score += 160;
      else if (kw.startsWith(cleanQ) && (cleanQ.length >= 2 || kw.length <= 4)) score += 80;
      else if (cleanQ.length >= 3 && kw.includes(cleanQ)) score += 25;
    });

    if (score > 0) {
      const hist = state.history.find(h => h.url === site.url);
      if (hist) {
        score += Math.min(hist.count * 30, 200);
        if (Date.now() - hist.timestamp < 7 * 86400000) score += 40;
      }
      return {
        name: site.name,
        url: site.url,
        icon: site.icon,
        subtitle: site.domain,
        score,
        badge: hist ? 'hist' : 'web',
      };
    }
    return null;
  }).filter(Boolean).sort((a, b) => b.score - a.score);

  scored.slice(0, 2).forEach(s => {
    results.push(s);
  });

  // 6. YouTube search option if not already handled
  if (!q.startsWith('yt ') && !q.startsWith('youtube ') && !isUrl && q.length >= 2 && !results.some(r => r.url && r.url.includes('youtube.com/results'))) {
    results.push({
      name: `YouTube search: “${query}”`,
      url: `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`,
      icon: '🎬',
      badge: 'web',
    });
  }

  return results.slice(0, 5);
}

function highlightQuery(text, _q) {
  return escapeHtml(text);
}

function renderResults(customResults = null) {
  const q = state.query.trim();
  $resultsList.innerHTML = '';
  state.results = customResults || buildResults(q);

  updateResumeButton();

  state.results.forEach((r, idx) => {
    const row = document.createElement('div');
    row.className = 'result-item' + (r.isTopMatch ? ' top-match' : '');
    row.dataset.idx = idx;
    row.style.setProperty('--i', idx);

    const favWrap = document.createElement('div');
    favWrap.className = 'item-favicon';
    if (r.isResume) {
      favWrap.textContent = '▶';
      favWrap.style.color = '#34d399';
    } else if (r.badge === 'google' || r.isSearch) {
      favWrap.textContent = r.icon || '🔍';
    } else {
      const favImg = document.createElement('img');
      favImg.src = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(r.url)}&sz=64`;
      favImg.onerror = () => {
        if (favImg.parentNode === favWrap) favWrap.removeChild(favImg);
        favWrap.textContent = r.icon || '🌐';
      };
      favWrap.appendChild(favImg);
    }

    const details = document.createElement('div');
    details.className = 'item-details';
    const title = document.createElement('div');
    title.className = 'item-title';
    title.innerHTML = highlightQuery(r.name, q);
    const url = document.createElement('div');
    url.className = 'item-url';
    url.textContent = r.subtitle || r.url;
    details.appendChild(title);
    details.appendChild(url);

    const badge = document.createElement('span');
    badge.className = 'item-badge ' + (
      r.badge === 'active' ? 'badge-active' :
      r.badge === 'top' ? 'badge-top' :
      r.badge === 'hist' ? 'badge-hist' :
      r.badge === 'google' ? 'badge-google' : 'badge-web'
    );
    badge.textContent = r.badge === 'active' ? '● Active' :
      r.badge === 'top' ? '★ Jump' :
      r.badge === 'hist' ? 'History' :
      r.badge === 'google' ? 'Google' : 'Web';

    row.appendChild(favWrap);
    row.appendChild(details);
    row.appendChild(badge);

    row.addEventListener('click', () => {
      clearGhost();
      if (r.isResume) resumeBrowser();
      else openUrlInTab(r.url);
    });
    row.addEventListener('mouseenter', () => {
      state.selected = idx;
      updateSelection();
    });

    $resultsList.appendChild(row);
  });

  if (state.selected >= state.results.length) {
    state.selected = 0;
  }
  updateSelection();

  const hasResults = state.results.length > 0 && q.length > 0;

  if (hasResults) {
    $resultsPnl.classList.add('visible');
    $shell.classList.add('has-results');
    API.resize('results', state.results.length);
  } else {
    $resultsPnl.classList.remove('visible');
    $shell.classList.remove('has-results');
    API.resize('search', 0);
  }
}

let liveSearchDebounce = null;
function scheduleSpotlightLiveSearch(rawQuery) {
  clearTimeout(liveSearchDebounce);
  const q = (rawQuery || '').trim();
  if (!q || q.length < 2 || q.startsWith('http://') || q.startsWith('https://') || (q.includes('.') && !q.includes(' '))) {
    return;
  }

  liveSearchDebounce = setTimeout(async () => {
    if (state.query.trim() !== q) return;
    try {
      const suggestions = await API.getSearchSuggestions(q);
      if (state.query.trim() !== q) return;
      if (!Array.isArray(suggestions) || suggestions.length === 0) return;

      const selectedEngineKey = state.settings?.searchEngine || 'google';
      const engine = SEARCH_ENGINES[selectedEngineKey] || SEARCH_ENGINES.google;

      const base = buildResults(q);
      const combined = [...base];

      let added = 0;
      for (const sug of suggestions) {
        const cleanSug = (typeof sug === 'string') ? sug.trim() : '';
        if (!cleanSug || cleanSug.toLowerCase() === q.toLowerCase()) continue;
        if (combined.some(r => r.name.toLowerCase() === cleanSug.toLowerCase())) continue;

        combined.push({
          name: cleanSug,
          url: engine.url(cleanSug),
          icon: '🔍',
          badge: 'google',
          subtitle: `${engine.name} smart suggestions`,
          isGoogleSuggestion: true,
        });
        added++;
        if (added >= 4 || combined.length >= 7) break;
      }

      if (added > 0) {
        renderResults(combined);
      }
    } catch (e) {}
  }, 130);
}

function updateSelection() {
  const rows = document.querySelectorAll('.result-item');
  rows.forEach((row, i) => {
    const isSel = i === state.selected;
    row.classList.toggle('selected', isSel);
    if (isSel) {
      row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  });
}

function updateResumeButton() {
  const activeTab = getActiveTab();
  const q = state.query ? state.query.trim() : '';
  if (activeTab && state.mode === 'search' && !q && !state.isSettingsOpen) {
    $btnResume.style.display = 'flex';

    $lblResume.textContent = `Resume: ${shortTitle}`;

    $btnResume.style.display = 'none';
  }
}
