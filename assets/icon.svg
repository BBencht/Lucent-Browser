<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Frosted Glass Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.85)" />
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.25)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>

    <!-- Royal Apple Blue / Neon Cyan Radial Glow -->
    <radialGradient id="lensGlow" cx="42%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#2563eb" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#1d4ed8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Inner Frosted Glass Lens Gradient -->
    <linearGradient id="glassPill" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.70)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.35)" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563eb" flood-opacity="0.35" />
    </filter>

    <!-- Lens Specular Shine Filter -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Apple Rounded App Icon Canvas -->
  <rect x="36" y="36" width="440" height="440" rx="100" ry="100" fill="url(#bgGrad)" filter="url(#softShadow)" />
  <rect x="36" y="36" width="440" height="440" rx="100" ry="100" fill="none" stroke="url(#rimGrad)" stroke-width="2.5" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="245" r="160" fill="url(#lensGlow)" />

  <!-- Iconic Floating Glass Capsule (Spotlight bar) -->
  <rect x="96" y="180" width="320" height="74" rx="37" ry="37" fill="url(#glassPill)" stroke="rgba(255, 255, 255, 0.65)" stroke-width="2" />
  
  <!-- Capsule Top Inset Highlight -->
  <path d="M 133 182 L 379 182" stroke="rgba(255, 255, 255, 0.85)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Magnifying Glass / Browser Compass Hybrid Symbol -->
  <circle cx="160" cy="217" r="18" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="174" y1="230" x2="188" y2="244" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />

  <!-- Safari / Compass Star Accent at Center -->
  <g transform="translate(290, 290)">
    <!-- Rotating Glow Ring -->
    <circle cx="0" cy="0" r="88" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="3" stroke-dasharray="12 10" />
    <circle cx="0" cy="0" r="76" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="2" />
    
    <!-- Compass Pointer (Liquid Glass Needle) -->
    <polygon points="0,-64 16,-12 0,0 -16,-12" fill="#38bdf8" />
    <polygon points="0,64 16,12 0,0 -16,12" fill="rgba(255, 255, 255, 0.85)" />
    <circle cx="0" cy="0" r="7" fill="#ffffff" />
  </g>

  <!-- Top Curved Specular Gloss Reflection -->
  <path d="M 50 140 C 120 70, 392 70, 462 140 C 370 170, 140 170, 50 140 Z" fill="url(#shineGrad)" />
</svg>
